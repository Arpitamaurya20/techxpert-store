# Copy to /etc/apache2/sites-available/ and replace YOURDOMAIN.
# Needs: a2enmod proxy proxy_http headers ssl rewrite

<VirtualHost *:80>
    ServerName api.YOURDOMAIN
    Redirect permanent / https://api.YOURDOMAIN/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.YOURDOMAIN

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.YOURDOMAIN/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.YOURDOMAIN/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Homecare→Store S2S is loopback-only. Block both /service and /api/service
    # (Store mounts routes with and without the /api prefix).
    <LocationMatch "^/(api/)?service(/|$)">
        Require all denied
    </LocationMatch>

    ProxyPass / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/
</VirtualHost>
